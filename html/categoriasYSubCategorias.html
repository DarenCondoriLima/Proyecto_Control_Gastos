<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías — ControlGastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/categoriasYSubCategorias.css">
</head>
<body>

<div id="sidebar-root"></div>
<script type="module" src="../js/sidebar-component.js"></script>

<div class="main">

    <header class="topbar">
        <div>
            <div class="topbar-title">Categorías y <span>Subcategorías</span></div>
            <div class="topbar-sub">Organiza la estructura de tus gastos e ingresos</div>
        </div>
        <button class="btn-primary-action" id="btn-open-cat-modal">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4v12M4 10h12" stroke-linecap="round"/></svg>
            Nueva Categoría de Gasto
        </button>
    </header>

    <div class="content">
        <div class="section-header section-header-spaced">
            <h3 class="section-title section-title-gastos">Categorías de Gastos</h3>
        </div>
        <div class="categories-grid" id="categories-grid">
        </div>

        <hr class="section-divider">

        <div class="section-header section-header-spaced section-header-row">
            <h3 class="section-title section-title-ingresos">Categorías de Ingresos</h3>
        </div>
        
        <div id="income-list-container" class="income-list-container">
            <div id="income-categories-list">
            </div>
            <button class="add-subcat-btn add-income-btn" id="btn-open-income-modal">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4v12M4 10h12" stroke-linecap="round"/></svg>
                Nueva categoría de ingreso
            </button>
        </div>

        <div class="empty-state" id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 5h18M3 10h14M3 15h8" stroke-linecap="round"/></svg>
            <p>Aún no tienes categorías.</p>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-cat">
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="cat-modal-title">Nueva Categoría</h3>
            <button class="modal-close" data-close="modal-cat">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l10 10M15 5L5 15" stroke-linecap="round"/></svg>
            </button>
        </div>
        <form id="form-category">
            <input type="hidden" id="edit-cat-id">
            <input type="hidden" id="cat-type-input" value="gasto">
            <div class="modal-body">
                <div class="field">
                    <label>Nombre de la categoría</label>
                    <input type="text" id="cat-name-input" placeholder="ej. Alimentación" required>
                </div>
            </div>
            <div class="modal-foot">
                <button type="submit" class="btn-save">Guardar categoría</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="modal-sub">
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="sub-modal-title">Nueva Subcategoría</h3>
            <button class="modal-close" data-close="modal-sub">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l10 10M15 5L5 15" stroke-linecap="round"/></svg>
            </button>
        </div>
        <form id="form-subcategory">
            <input type="hidden" id="parent-cat-id">
            <input type="hidden" id="edit-sub-id">
            <div class="modal-body">
                <div class="modal-parent-hint">Categoría padre: <b id="parent-name-display">—</b></div>
                <div class="field">
                    <label>Nombre de la subcategoría</label>
                    <input type="text" id="sub-name-input" placeholder="ej. Restaurantes" required>
                </div>
            </div>
            <div class="modal-foot">
                <button type="submit" class="btn-save sage">Guardar subcategoría</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="../js/main.js"></script>
<script type="module" src="../js/categorias.js"></script>
</body>
</html>
