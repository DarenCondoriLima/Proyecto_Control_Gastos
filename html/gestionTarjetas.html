<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Tarjetas de Credito — ControlGastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/gestionTarjetas.css">
</head>
<body>

<div id="sidebar-root"></div>
<script type="module" src="../js/sidebar-component.js"></script>

<main class="main">
    <div class="form-container" style="max-width: 1000px;">
        <h1 class="form-title">Gestión de <span>Tarjetas de Crédito</span></h1>

        <div class="cards-grid" id="credit-summary-grid">
            </div>

        <section class="budget-section" style="margin-top: 2rem;">
            <div style="display: flex; gap: 1rem;">
                <button id="btn-pay-card" class="btn-submit btn-primary-submit">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;"><path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    Registrar Pago de Tarjeta
                </button>
            </div>
        </section>

        <section class="budget-section" style="margin-top: 2rem;">
            <h3>Próximos Cierres y Pagos</h3>
            <div id="timeline-container" class="timeline">
                </div>
        </section>
    </div>
</main>

<script type="module" src="../js/main.js"></script>
<script type="module" src="../js/gestionTarjetas.js"></script>
</body>
</html>
