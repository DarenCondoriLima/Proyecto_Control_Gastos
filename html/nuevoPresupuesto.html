<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlGastos — Nuevo Presupuesto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/nuevoPresupuesto.css">
</head>
<body>
    <div id="sidebar-root"></div> 
    <script type="module" src="../js/sidebar-component.js"></script>

    <main class="main">
        <div class="form-container">
            <h1 class="form-title">Definir Nuevo <span>Límite</span></h1>
            
            <form id="budget-form">
                <div class="field">
                    <label>Nombre del Presupuesto</label>
                    <input type="text" id="budget-name" placeholder="Ej: Gastos Fijos Abril" required>
                </div>

                <div class="field-group">
                    <div class="field">
                        <label>Mes</label>
                        <select id="budget-month" required>
                            <option value="1">Enero</option><option value="2">Febrero</option>
                            <option value="3">Marzo</option><option value="4" selected>Abril</option>
                            <option value="5">Mayo</option><option value="6">Junio</option>
                            <option value="7">Julio</option><option value="8">Agosto</option>
                            <option value="9">Septiembre</option><option value="10">Octubre</option>
                            <option value="11">Noviembre</option><option value="12">Diciembre</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Año</label>
                        <input type="number" id="budget-year" value="2026" required>
                    </div>
                </div>

                <div class="field-group">
                    <div class="field">
                        <label>Monto Límite</label>
                        <input type="number" id="budget-total" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="field">
                        <label>Moneda</label>
                        <select id="budget-currency">
                            <option value="PEN">Soles (PEN)</option>
                            <option value="USD">Dólares (USD)</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="button" class="btn-submit" style="background: var(--paper); color: var(--muted);" onclick="history.back()">Cancelar</button>
                    <button type="submit" class="btn-submit btn-primary-submit">Guardar Presupuesto</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="../js/nuevoPresupuesto.js"></script>
</body>
</html>
