<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlGastos — Planificador Unificado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/gestionPresupuesto.css">
</head>
<body>
    <div id="sidebar-root"></div>
    <script type="module" src="../js/sidebar-component.js"></script>

    <main class="main">
        <div class="form-container">
            <h1 class="form-title">Planificación <span>Mensual</span></h1>
            
            <section class="period-selector" id="period-selector" style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem;">
                <select id="filter-month" class="select-period">
                    <option value="1">Enero</option><option value="2">Febrero</option>
                    <option value="3">Marzo</option><option value="4">Abril</option>
                    <option value="5">Mayo</option><option value="6">Junio</option>
                    <option value="7">Julio</option><option value="8">Agosto</option>
                    <option value="9">Septiembre</option><option value="10">Octubre</option>
                    <option value="11">Noviembre</option><option value="12">Diciembre</option>
                </select>
                <input type="number" id="filter-year" class="input-period" value="2026">
                <button id="btn-load-period" class="btn-load">Cargar Periodo</button>
            </section>

            <section class="budget-section">
                <div class="income-badge">
                    Ingreso Restante (Disponible): <span id="available-amount">S/ 0.00</span>
                    <div style="margin-top:10px; font-size:0.8rem; opacity:0.8;">
                        Ingresos del Mes (Total): <span id="monthly-income" style="font-weight: bold;">S/ 0.00</span>
                    </div>
                </div>
            </section>

            <section class="budget-section">
                <div id="budget-rows-container"></div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" id="btn-add-row" class="btn-submit" style="background: var(--paper); color: var(--ink);">
                        + Añadir Categoría
                    </button>
                    <button type="button" id="btn-save-all" class="btn-submit btn-primary-submit">
                        Guardar Planificación Completa
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/gestionPresupuesto.js"></script>
</body>
</html>
