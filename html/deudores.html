<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deudores — ControlGastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/deudores.css">
</head>
<body>

<div id="sidebar-root"></div>
<script type="module" src="../js/sidebar-component.js"></script>

<main class="main">
    <div class="header-flex">
        <h1>Mis <span>Deudores</span></h1>
        <button class="btn-add" id="btn-new-debt">Nuevo Préstamo</button>
    </div>
    <div class="debt-grid" id="debt-container"></div>
</main>

<div class="modal" id="debt-modal">
    <div class="modal-content">
        <h3>Registrar Préstamo</h3>
        <form id="debt-form">
            <input type="hidden" id="edit-debt-id">
            
            <div class="field">
                <label>Nombre del Deudor</label>
                <input type="text" id="debt-name" placeholder="ej. Juan Pérez" required>
            </div>

            <div class="field">
                <label>Descripción / Motivo</label>
                <input type="text" id="debt-desc" placeholder="ej. Préstamo para pasajes" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="field">
                    <label>Monto Total (S/)</label>
                    <input type="number" id="debt-amount" step="0.01" required>
                </div>
                <div class="field">
                    <label>Ya pagado (S/)</label>
                    <input type="number" id="debt-paid" step="0.01" value="0">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="field">
                    <label>Fecha Préstamo</label>
                    <input type="date" id="debt-date" required>
                </div>
                <div class="field">
                    <label>Fecha Vencimiento</label>
                    <input type="date" id="debt-due">
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="button" class="btn-save" style="background: var(--cream2); color: var(--ink);" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-save">Guardar Préstamo</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="../js/deudores.js"></script>
</body>
</html>
